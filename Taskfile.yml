version: '3'

tasks:
  sanitize:
    desc: Extract and sanitize raw career documents into safe evidence JSON
    cmds:
      - .agents/bin/sanitize-data

  audit:
    desc: Audit repository compliance to ensure zero proprietary data leaks
    cmds:
      - .agents/bin/audit-compliance

  ci:
    desc: Run verification pipeline (audit, lint, and build)
    cmds:
      - .agents/bin/run-ci

  commit:
    desc: Perform deterministic smart git commit
    cmds:
      - .agents/bin/git-smart-commit

  dev:
    desc: Launch web development server
    dir: web
    cmds:
      - npm run dev

  build:
    desc: Build production web bundle
    dir: web
    cmds:
      - npm run build
