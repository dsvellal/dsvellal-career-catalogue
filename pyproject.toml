[project]
name = "twin"
version = "0.1.0"
description = "Personal knowledge context system — a first-person digital twin"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Datta Vellal" }]

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "duckdb>=1.1",
    "chromadb>=0.5",
    "networkx>=3.4",
    "google-genai>=1.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "weasyprint>=62",
    "httpx>=0.27",
    "markdown>=3.7",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pytesseract>=0.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-cov>=6.0",
    "fpdf2>=2.8",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
]

[project.scripts]
twin = "twin.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B110", "B404", "B603", "B607", "B608"]
# B101: assert ok for our use case
# B110: try/except/pass used intentionally for OCR fallback
# B404/B603/B607: subprocess used safely for typst compilation (no user input)
# B608: SQL f-string only uses hardcoded table names from a tuple literal

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
