<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twin — Digital Twin Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; height: 100vh; display: flex; flex-direction: column; }
        header { background: #2c3e50; color: white; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        header .badge { background: #27ae60; font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 10px; }
        .chat-container { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .message { max-width: 75%; padding: 0.875rem 1.125rem; border-radius: 12px; line-height: 1.5; font-size: 0.9375rem; }
        .message.user { align-self: flex-end; background: #2c3e50; color: white; border-bottom-right-radius: 4px; }
        .message.assistant { align-self: flex-start; background: white; border: 1px solid #e9ecef; border-bottom-left-radius: 4px; }
        .message .citations { margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px solid #e9ecef; font-size: 0.8rem; color: #6c757d; }
        .message .citation { display: inline-block; background: #f1f3f5; padding: 0.15rem 0.5rem; border-radius: 4px; margin: 0.15rem; }
        .input-area { background: white; border-top: 1px solid #dee2e6; padding: 1rem 1.5rem; }
        .input-form { display: flex; gap: 0.75rem; max-width: 800px; margin: 0 auto; }
        .input-form input { flex: 1; padding: 0.75rem 1rem; border: 1px solid #dee2e6; border-radius: 8px; font-size: 0.9375rem; outline: none; transition: border-color 0.2s; }
        .input-form input:focus { border-color: #2c3e50; }
        .input-form button { padding: 0.75rem 1.5rem; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 0.9375rem; cursor: pointer; transition: background 0.2s; }
        .input-form button:hover { background: #34495e; }
        .input-form button:disabled { background: #95a5a6; cursor: not-allowed; }
        .loading { display: none; align-self: flex-start; padding: 1rem; }
        .loading.active { display: block; }
        .loading .dots span { animation: blink 1.4s infinite; font-size: 1.5rem; color: #6c757d; }
        .loading .dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
        .welcome { text-align: center; color: #6c757d; padding: 3rem 1rem; }
        .welcome h2 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #2c3e50; }
    </style>
</head>
<body>
    <header>
        <h1>Twin</h1>
        <span class="badge">Digital Twin</span>
    </header>

    <div class="chat-container" id="chat">
        <div class="welcome">
            <h2>Ask me anything</h2>
            <p>I'm Datta's digital twin. Ask about experience, skills, or projects.</p>
        </div>
    </div>

    <div class="input-area">
        <form class="input-form" id="ask-form">
            <input type="text" id="question" name="question" placeholder="Ask a question..." autocomplete="off" autofocus>
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const form = document.getElementById('ask-form');
        const input = document.getElementById('question');
        const btn = document.getElementById('send-btn');
        let conversationContext = [];

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = input.value.trim();
            if (!question) return;

            // Remove welcome
            const welcome = chat.querySelector('.welcome');
            if (welcome) welcome.remove();

            // Add user message
            addMessage(question, 'user');
            input.value = '';
            btn.disabled = true;

            // Show loading
            const loading = document.createElement('div');
            loading.className = 'loading active';
            loading.innerHTML = '<div class="dots"><span>.</span><span>.</span><span>.</span></div>';
            chat.appendChild(loading);
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        question: question,
                        context: {audience: 'peer_engineer'}
                    })
                });
                const data = await res.json();
                loading.remove();

                if (res.ok) {
                    addMessage(data.answer, 'assistant', data.citations);
                    conversationContext.push({q: question, a: data.answer});
                } else {
                    addMessage('Sorry, I encountered an error. ' + (data.detail || ''), 'assistant');
                }
            } catch (err) {
                loading.remove();
                addMessage('Connection error. Is the server running?', 'assistant');
            }

            btn.disabled = false;
            input.focus();
        });

        function addMessage(text, role, citations) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;

            if (citations && citations.length > 0) {
                const citDiv = document.createElement('div');
                citDiv.className = 'citations';
                citDiv.innerHTML = '<strong>Sources:</strong> ' +
                    citations.map(c => `<span class="citation">${c.source}: ${c.content.substring(0, 50)}...</span>`).join('');
                div.appendChild(citDiv);
            }

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
